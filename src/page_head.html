<title>2X Deck Fixer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a single working column (drop zone, results) with a quiet reference column beside it on wide screens. */
:root {
  --bg: #ffffff; --surface: #f6f6f5; --surface-2: #ececea; --line: #e2e1de;
  --fg: #151515; --muted: #5c5b58; --faint: #8a8884;
  --accent: #ff0f0f; --accent-ink: #c40000; --accent-soft: #fff0f0;
  --ok: #0a7a52; --ok-soft: #e6f4ee; --warn: #8a5a00; --warn-soft: #fbf1dc; --bad: #b3261e; --bad-soft: #fbe9e7;
  --font: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151515; --surface: #1e1e1d; --surface-2: #272726; --line: #333331;
  --fg: #f4f4f2; --muted: #b3b1ac; --faint: #8d8b86;
  --accent: #ff3b3b; --accent-ink: #ff6b6b; --accent-soft: #2a1414;
  --ok: #4fd1a1; --ok-soft: #12261f; --warn: #f2c063; --warn-soft: #2a2213; --bad: #ff8a80; --bad-soft: #2c1615;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151515; --surface: #1e1e1d; --surface-2: #272726; --line: #333331;
  --fg: #f4f4f2; --muted: #b3b1ac; --faint: #8d8b86;
  --accent: #ff3b3b; --accent-ink: #ff6b6b; --accent-soft: #2a1414;
  --ok: #4fd1a1; --ok-soft: #12261f; --warn: #f2c063; --warn-soft: #2a2213; --bad: #ff8a80; --bad-soft: #2c1615;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.08; letter-spacing: -.025em; font-weight: 800; margin: 10px 0 12px; text-wrap: balance; }
h1 .dot { color: var(--accent); }
.lead { color: var(--muted); max-width: 62ch; margin: 0; font-size: 16px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; margin-top: 32px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: var(--radius); background: var(--surface);
  cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop .big { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.drop .small { color: var(--muted); font-size: 14px; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 10px; }
.bar h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.row.example { background: var(--surface); border-style: dashed; }
.name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.meta { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 0; }
.meta b { color: var(--fg); font-weight: 600; }
.right { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.busy { background: var(--surface-2); color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ex { background: var(--surface-2); color: var(--faint); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--faint); border-right-color: transparent; border-radius: 50%;
  animation: r .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes r { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
button { font: inherit; font-weight: 600; font-size: 14px; border-radius: 10px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:hover { border-color: var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.note.err { color: var(--bad); }

aside { display: flex; flex-direction: column; gap: 22px; }
aside h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.fixes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.fixes li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.fixes li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); margin: 7px 0 0 4px; }
.fixes b { font-weight: 600; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.steps li::marker { color: var(--accent-ink); font-weight: 700; }
.box { border-top: 1px solid var(--line); padding-top: 18px; }
.private { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.private svg { flex: none; margin-top: 2px; color: var(--ok); }
footer { margin-top: 40px; font-size: 12.5px; color: var(--faint); }
.opt{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:14px;line-height:1.45;color:var(--muted);cursor:pointer}
.opt input{margin-top:3px;accent-color:#FF0F0F;width:16px;height:16px;flex:none}
.opt b{color:var(--fg)}
.log{grid-column:1/-1;margin-top:8px;font-size:13px}
.log summary{cursor:pointer;color:var(--muted)}
.log ul{margin:6px 0 0;padding-left:18px;max-height:220px;overflow:auto}
</style>
